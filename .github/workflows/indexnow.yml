# After Vercel finishes a production deploy, tell IndexNow (Bing, and through
# it ChatGPT search) which pages changed since the previous production deploy.
# Vercel reports each deploy to GitHub as a deployment, which triggers this.
name: IndexNow

on: deployment_status

permissions:
  contents: read
  deployments: read

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the previous successful production deploy
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ github.event.deployment.id }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=30" --jq ".[] | select(.id < $CURRENT) | .id"); do
            if [ "$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state')" = "success" ]; then
              echo "sha=$(gh api "repos/${{ github.repository }}/deployments/$id" --jq .sha)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No earlier successful production deploy found; nothing to compare against."

      - name: Announce changed pages
        if: steps.previous.outputs.sha != ''
        run: node scripts/indexnow.mjs "${{ steps.previous.outputs.sha }}" "${{ github.event.deployment.sha }}"
